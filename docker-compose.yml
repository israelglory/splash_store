services:
  db:
    container_name: postgres-splashStore
    image: postgres:latest
    environment:
      POSTGRES_USER: splash
      POSTGRES_PASSWORD: password
      PGDATA: /data/postgres
    ports:
      - "5433:5432"
    volumes:
      - db:/data/postgres
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    driver: bridge
volumes:
  db:
